<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for Smart Parking System.">
    <title>Register – Smart Parking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/register.css?v=2.2">
</head>
<body>

<main class="card" role="main">

    <header class="card-header">
        <a href="index.html" class="logo-box">
            <div class="logo-icon">P</div>
            <span class="logo-title">Smart Parking</span>
        </a>
        <p class="card-subtitle">Create a new smart parking account</p>
    </header>

    <form id="registerForm" method="POST" action="../php/register.php" novalidate>

        <div class="form-group">
            <label for="full_name">
                Full Name <span class="required-star">*</span>
            </label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="e.g. Alex Morgan"
                autocomplete="name"
                maxlength="100"
            >
            <small id="fullNameError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="email">
                Email Address <span class="required-star">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                maxlength="254"
            >
            <small id="emailError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="mobile">
                Mobile Number <span class="required-star">*</span>
            </label>
            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="10-digit number (starts with 6-9)"
                maxlength="10"
            >
            <small id="mobileError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="password">
                Password <span class="required-star">*</span>
            </label>
            <div class="pw-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Min 8 chars, A-Z, 0-9, symbol"
                    autocomplete="new-password"
                    maxlength="64"
                >
                <button type="button" id="togglePw" class="show-hide-btn">Show</button>
            </div>
            <div class="strength-bar">
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
            </div>
            <div id="strengthText" class="strength-text"></div>
            <small id="passwordError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="confirm_password">
                Confirm Password <span class="required-star">*</span>
            </label>
            <div class="pw-wrap">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                >
                <button type="button" id="toggleCpw" class="show-hide-btn">Show</button>
            </div>
            <small id="confirmError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="address">
                Address <span class="required-star">*</span>
            </label>
            <textarea
                id="address"
                name="address"
                placeholder="Enter your full address (min 10 characters)"
                rows="3"
                maxlength="250"
            ></textarea>
            <small id="addressError" class="error-msg"></small>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="terms" name="terms">
            <label for="terms">
                I agree to the <a href="#">Terms &amp; Conditions</a>
            </label>
        </div>
        <small id="termsError" class="error-msg"></small>

        <button type="submit" id="submitBtn" class="btn btn-primary">Create Account</button>
        <button type="reset"  id="resetBtn"  class="btn btn-secondary">Clear Form</button>

    </form>

    <p class="login-link">
        Already have an account? <a href="login.html">Login here</a> <span class="sep">&bull;</span> <a href="index.html">Back to Home</a>
    </p>

</main>

<script src="../js/register.js"></script>

</body>
</html>
