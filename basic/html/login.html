<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Smart Parking System.">
    <title>Login – Smart Parking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css?v=2.2">
</head>
<body>

<main class="card" role="main">

    <header class="card-header">
        <a href="index.html" class="logo-box">
            <div class="logo-icon">P</div>
            <span class="logo-title">Smart Parking</span>
        </a>
        <p class="card-subtitle">Sign in to access your parking dashboard</p>
    </header>

    <!-- Error messages from PHP (shown by login.js) -->
    <div id="serverError" class="server-error-msg" style="display:none;"></div>

    <form id="loginForm" method="POST" action="../php/login.php" novalidate>

        <div class="form-group">
            <label for="email">
                Email Address <span class="required-star">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                maxlength="254"
            >
            <small id="emailError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="password">
                Password <span class="required-star">*</span>
            </label>
            <div class="pw-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
                <button type="button" id="togglePw" class="show-hide-btn">Show</button>
            </div>
            <small id="passwordError" class="error-msg"></small>
        </div>

        <p class="forgot-link">
            <a href="#">Forgot password?</a>
        </p>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary">Sign In</button>

    </form>

    <p class="register-link">
        New user? <a href="register.html">Create an account</a> <span class="sep">&bull;</span> <a href="index.html">Back to Home</a>
    </p>

</main>

<script src="../js/login.js"></script>

</body>
</html>
