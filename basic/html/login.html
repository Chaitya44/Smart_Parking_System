<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Smart Parking System.">
    <title>Login – Smart Parking System</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="card" role="main">

    <header class="card-header">
        <div class="logo-box">
            <div class="logo-icon">P</div>
            <span class="logo-title">Smart Parking</span>
        </div>
        <p class="card-subtitle">Login to your account</p>
    </header>

    <form id="loginForm" method="POST" action="../php/login.php" novalidate>

        <div class="form-group">
            <label for="email">
                Email Address <span class="required-star">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                maxlength="254"
            >
            <small id="emailError" class="error-msg"></small>
        </div>

        <div class="form-group">
            <label for="password">
                Password <span class="required-star">*</span>
            </label>
            <div class="pw-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
                <button type="button" id="togglePw" class="show-hide-btn">Show</button>
            </div>
            <small id="passwordError" class="error-msg"></small>
        </div>

        <p class="forgot-link">
            <a href="#">Forgot password?</a>
        </p>

        <button type="submit" class="btn btn-primary">Login</button>

    </form>

    <p class="register-link">
        New user? <a href="register.html">Create an account</a> &bull; <a href="index.html">Home</a>
    </p>

</main>

<script src="../js/login.js"></script>

</body>
</html>
