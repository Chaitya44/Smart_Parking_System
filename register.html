<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Smart Parking account.">
    <title>Create Account – Smart Parking System</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<!-- Full-screen canvas: glass-lens.js draws animated orbs here.
     This is what gets REFRACTED through the glass lens. -->
<canvas id="bgCanvas" aria-hidden="true"></canvas>

<main class="card" role="main">

    <!-- Lens canvas: glass-lens.js renders the refracted view of bgCanvas here.
         Sits at z-index 1 inside card, beneath content. -->
    <canvas id="lensCanvas" aria-hidden="true"></canvas>

    <!-- Dark tint over refracted image → keeps text readable -->
    <div class="glass-tint" aria-hidden="true"></div>

    <!-- ── Header ── -->
    <header class="card-header">
        <div class="logo">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M6 3h7a6 6 0 0 1 0 12H9v6H6V3zm3 9h4a3 3 0 0 0 0-6H9v6z"/>
                </svg>
            </div>
            <span class="logo-text">Smart Parking</span>
        </div>
        <p class="card-subtitle">Create your account</p>
    </header>

    <!-- ── Form ── -->
    <form
        id="registerForm"
        method="POST"
        action="register.php"
        novalidate
        aria-label="User registration form"
    >
        <!-- Full Name -->
        <div class="form-group">
            <label for="full_name">Full Name <span class="required-star" aria-hidden="true">*</span></label>
            <input type="text" id="full_name" name="full_name"
                autocomplete="name" maxlength="100"
                placeholder="e.g. Chaitya Shah"
                required aria-required="true" aria-describedby="fullNameError">
            <small id="fullNameError" class="error-message"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email Address <span class="required-star" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email"
                autocomplete="email" maxlength="254"
                placeholder="you@example.com"
                required aria-required="true" aria-describedby="emailError">
            <small id="emailError" class="error-message"></small>
        </div>

        <!-- Mobile -->
        <div class="form-group">
            <label for="mobile">Mobile Number <span class="required-star" aria-hidden="true">*</span></label>
            <input type="tel" id="mobile" name="mobile"
                autocomplete="tel" maxlength="10"
                pattern="[6-9][0-9]{9}"
                placeholder="10-digit Indian number"
                required aria-required="true" aria-describedby="mobileError">
            <small id="mobileError" class="error-message"></small>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password <span class="required-star" aria-hidden="true">*</span></label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password"
                    autocomplete="new-password" minlength="8" maxlength="64"
                    placeholder="Min 8 chars, upper, number, symbol"
                    required aria-required="true" aria-describedby="passwordError">
                <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">Show</button>
            </div>
            <div class="strength-bar-wrap" aria-hidden="true">
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
            </div>
            <div id="strengthLabel" class="strength-label" aria-live="polite"></div>
            <small id="passwordError" class="error-message"></small>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirm_password">Confirm Password <span class="required-star" aria-hidden="true">*</span></label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password"
                    autocomplete="new-password"
                    placeholder="Re-enter your password"
                    required aria-required="true" aria-describedby="confirmPasswordError">
                <button type="button" id="toggleConfirmPassword" class="toggle-password" aria-label="Show confirm password">Show</button>
            </div>
            <small id="confirmPasswordError" class="error-message"></small>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">Address <span class="required-star" aria-hidden="true">*</span></label>
            <textarea id="address" name="address"
                rows="3" minlength="10" maxlength="250"
                placeholder="Your full address"
                required aria-required="true" aria-describedby="addressError"></textarea>
            <small id="addressError" class="error-message"></small>
        </div>

        <!-- Terms -->
        <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" aria-describedby="termsError">
            <label for="terms">I agree to the <a href="#">Terms &amp; Conditions</a></label>
        </div>
        <small id="termsError" class="error-message"></small>

        <!-- Buttons -->
        <div class="btn-group">
            <button type="submit" id="submitBtn" class="btn btn-primary">Create Account</button>
            <button type="reset"  id="resetBtn"  class="btn btn-secondary">Clear</button>
        </div>
    </form>

    <p class="login-link">
        Already have an account? <a href="login.html">Login</a>
    </p>

</main>

<!-- Load lens engine first so it sets up canvases,
     then load form validation -->
<script src="glass-lens.js"></script>
<script src="register.js"></script>
</body>
</html>
